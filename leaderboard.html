<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train Rat — Leaderboard</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🐀</text></svg>'>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .bg {
      position: fixed;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      z-index: -1;
    }
    .dragon-emoji {
      font-size: 60px;
      filter: drop-shadow(0 0 20px #ffcc00);
      margin-bottom: 10px;
    }
    h1 {
      font-size: 42px;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffcc00, #aaa, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px #ffcc00);
      margin-bottom: 6px;
    }
    .subtitle { color: #aaa; letter-spacing: 2px; font-size: 14px; margin-bottom: 40px; }
    .logo { width: min(80vw, 380px); filter: drop-shadow(0 0 16px #ffcc0055); margin-bottom: 10px; }
    table {
      width: 100%;
      max-width: 500px;
      border-collapse: collapse;
    }
    th {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      color: #ffcc00;
      padding: 10px 16px;
      border-bottom: 1px solid #333;
      text-align: left;
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a2e;
      font-size: 18px;
    }
    tr:hover td { background: #ffffff08; }
    .rank { color: #555; font-size: 14px; width: 40px; }
    tr:nth-child(1) .rank { color: #ffd700; font-size: 20px; }
    tr:nth-child(2) .rank { color: #aaa; font-size: 18px; }
    tr:nth-child(3) .rank { color: #cd7f32; font-size: 16px; }
    .score { color: #ffcc00; font-weight: bold; text-align: right; }
    .date { color: #444; font-size: 12px; text-align: right; }
    .empty { color: #444; text-align: center; padding: 40px; font-size: 16px; letter-spacing: 1px; }
    .loading { color: #555; text-align: center; padding: 40px; letter-spacing: 2px; }
    .back-btn {
      margin-top: 40px;
      display: inline-block;
      padding: 12px 36px;
      font-family: 'Georgia', serif;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      transition: all 0.2s;
      font-size: 14px;
    }
    .back-btn:hover { color: #fff; border-color: #ffcc00; box-shadow: 0 0 20px #ffcc0044; }
    footer { position: fixed; bottom: 20px; color: #333; font-size: 12px; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <svg class="logo" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Train Rat">
    <defs>
      <linearGradient id="tr-gold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe066"/>
        <stop offset="0.55" stop-color="#ffcc00"/>
        <stop offset="1" stop-color="#ff9900"/>
      </linearGradient>
    </defs>
    <g transform="translate(452 38)">
      <g stroke="#ffcc0088" stroke-width="4" stroke-linecap="round">
        <line x1="44" y1="-10" x2="66" y2="-10"/>
        <line x1="52" y1="0" x2="78" y2="0"/>
        <line x1="46" y1="10" x2="64" y2="10"/>
      </g>
      <g fill="#ffcc00">
        <path d="M28 2 Q 58 -8 76 8" stroke="#ffcc00" stroke-width="5" fill="none" stroke-linecap="round"/>
        <ellipse cx="0" cy="0" rx="30" ry="15"/>
        <circle cx="-32" cy="-5" r="11"/>
        <polygon points="-41,-8 -56,-3 -41,1"/>
        <circle cx="-34" cy="-15" r="6"/>
        <ellipse cx="-16" cy="13" rx="6" ry="3.5"/>
        <ellipse cx="14" cy="13" rx="7" ry="4"/>
      </g>
    </g>
    <text x="320" y="138" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="86" letter-spacing="8" fill="url(#tr-gold)" stroke="#201400" stroke-width="4" paint-order="stroke">TRAIN RAT</text>
    <g fill="#a87400">
      <rect x="88" y="163" width="14" height="44" rx="3"/>
      <rect x="168" y="163" width="14" height="44" rx="3"/>
      <rect x="248" y="163" width="14" height="44" rx="3"/>
      <rect x="328" y="163" width="14" height="44" rx="3"/>
      <rect x="408" y="163" width="14" height="44" rx="3"/>
      <rect x="488" y="163" width="14" height="44" rx="3"/>
    </g>
    <g fill="#ffcc00">
      <rect x="70" y="168" width="450" height="7" rx="3"/>
      <rect x="52" y="194" width="486" height="7" rx="3"/>
    </g>
  </svg>
  <p class="subtitle">🏆 Leaderboard — Top Rats</p>

  <table id="board">
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th style="text-align:right">Score</th>
        <th style="text-align:right">Date</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="4" class="loading">Loading...</td></tr>
    </tbody>
  </table>

  <a href="index.html" class="back-btn">← Back to the game</a>
  <footer>© 2026 Train Rat</footer>

  <script>
    fetch('https://dev.brasstix.com/bktrg/leaderboard.php')
      .then(r => r.json())
      .then(scores => {
        const tbody = document.getElementById('rows');
        if (!scores.length) {
          tbody.innerHTML = '<tr><td colspan="4" class="empty">No scores yet — be the first!</td></tr>';
          return;
        }
        const medals = ['🥇','🥈','🥉'];
        const charIcons = { rat: '🐀', squirrel: '🐿️', echidna: '🦔' };
        const flagEmoji = code => /^[A-Z]{2}$/.test(code || '') ? String.fromCodePoint(...[...code].map(c => 0x1f1e6 + c.charCodeAt(0) - 65)) : '';
        tbody.innerHTML = scores.map((s, i) =>
          `<tr>
            <td class="rank">${medals[i] || i+1}</td>
            <td>${flagEmoji(s.flag)} ${charIcons[s.char] || ""} ${s.name}</td>
            <td class="score">${s.score.toLocaleString()}</td>
            <td class="date">${s.date}</td>
          </tr>`
        ).join('');
      })
      .catch(() => {
        document.getElementById('rows').innerHTML =
          '<tr><td colspan="4" class="empty">Could not load scores.</td></tr>';
      });
  </script>
</body>
</html>
