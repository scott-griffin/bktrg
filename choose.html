<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Dragon — Dragon Run</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px 60px;
    }
    h1 {
      font-size: 40px;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff6600, #ffcc00, #ff3300);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px #ff6600);
      margin-bottom: 6px;
      text-align: center;
    }
    .sub { color: #888; letter-spacing: 2px; font-size: 14px; margin-bottom: 36px; text-align: center; }

    label { display: block; color: #aaa; letter-spacing: 2px; font-size: 13px; text-transform: uppercase; margin-bottom: 8px; }
    input[type=text] {
      width: 100%; max-width: 420px;
      padding: 14px 18px;
      font-size: 18px;
      font-family: 'Georgia', serif;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      color: #fff;
      display: block;
      margin: 0 auto 32px;
      transition: border-color 0.2s;
    }
    input[type=text]:focus { outline: none; border-color: #ff6600; box-shadow: 0 0 12px #ff660044; }

    .type-label { color: #aaa; letter-spacing: 2px; font-size: 13px; text-transform: uppercase; text-align: center; margin-bottom: 16px; }
    .dragons {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      max-width: 560px;
      width: 100%;
      margin: 0 auto 36px;
    }
    .dragon-card {
      position: relative;
      cursor: pointer;
    }
    .dragon-card input[type=radio] {
      position: absolute; opacity: 0; width: 0; height: 0;
    }
    .dragon-card label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 8px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #111;
      cursor: pointer;
      transition: all 0.18s;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #aaa;
      margin: 0;
    }
    .dragon-card label .icon { font-size: 28px; }
    .dragon-card input:checked + label {
      border-color: var(--clr);
      background: #1a1a1a;
      color: #fff;
      box-shadow: 0 0 16px var(--glow);
    }
    .dragon-card label:hover { border-color: #555; color: #ddd; }

    .start-btn {
      display: block;
      width: 100%; max-width: 420px;
      margin: 0 auto;
      padding: 16px;
      font-size: 22px;
      font-family: 'Georgia', serif;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #cc3300, #ff6600);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 24px #ff6600aa;
      transition: all 0.2s;
    }
    .start-btn:hover { transform: scale(1.03); box-shadow: 0 0 40px #ff6600; }
    .start-btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }

    .error { color: #ff4444; font-size: 13px; text-align: center; margin-top: -20px; margin-bottom: 20px; display: none; }
    footer { position: fixed; bottom: 20px; color: #444; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Dragon Run</h1>
  <p class="sub">Choose your dragon before you run</p>

  <label for="pname">Your Name</label>
  <input type="text" id="pname" maxlength="20" placeholder="Enter your name…" autocomplete="off">
  <p class="error" id="err">Please enter your name and select a dragon type.</p>

  <p class="type-label">Dragon Type</p>
  <div class="dragons" id="dragonGrid"></div>

  <button class="start-btn" id="startBtn">Start Adventure</button>
  <footer>© 2025 Dragon Run</footer>

  <script>
    const types = [
      { id: 'water',    icon: '💧', color: '#0099ff', glow: '#0099ff88' },
      { id: 'fire',     icon: '🔥', color: '#ff4400', glow: '#ff440088' },
      { id: 'grass',    icon: '🌿', color: '#33cc44', glow: '#33cc4488' },
      { id: 'electric', icon: '⚡', color: '#ffcc00', glow: '#ffcc0088' },
      { id: 'steel',    icon: '⚔️', color: '#aabbcc', glow: '#aabbcc88' },
      { id: 'rock',     icon: '🪨', color: '#997755', glow: '#99775588' },
      { id: 'ground',   icon: '🌍', color: '#cc9944', glow: '#cc994488' },
      { id: 'fighting', icon: '👊', color: '#ff6633', glow: '#ff663388' },
      { id: 'sidekick', icon: '🐾', color: '#cc66ff', glow: '#cc66ff88' },
      { id: 'fairy',    icon: '🧚', color: '#ff99cc', glow: '#ff99cc88' },
    ];

    const grid = document.getElementById('dragonGrid');
    types.forEach(t => {
      const wrap = document.createElement('div');
      wrap.className = 'dragon-card';
      wrap.style.setProperty('--clr', t.color);
      wrap.style.setProperty('--glow', t.glow);
      wrap.innerHTML = `
        <input type="radio" name="dragon" id="d_${t.id}" value="${t.id}">
        <label for="d_${t.id}">
          <span class="icon">${t.icon}</span>
          ${t.id}
        </label>`;
      grid.appendChild(wrap);
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      const name = document.getElementById('pname').value.trim();
      const dragonInput = document.querySelector('input[name=dragon]:checked');
      const err = document.getElementById('err');
      if (!name || !dragonInput) {
        err.style.display = 'block';
        return;
      }
      err.style.display = 'none';
      localStorage.setItem('dragonName', name);
      localStorage.setItem('dragonType', dragonInput.value);
      window.location.href = 'game.html';
    });
  </script>
</body>
</html>
