<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Run</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .stars {
      position: fixed;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      z-index: -1;
    }
    .hero { text-align: center; padding: 40px 20px; }
    .dragon-emoji {
      font-size: 100px;
      display: block;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px #ff6600);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    h1 {
      font-size: 64px;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff6600, #ffcc00, #ff3300);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 20px 0 10px;
      filter: drop-shadow(0 0 10px #ff6600);
    }
    .tagline { font-size: 20px; color: #aaa; letter-spacing: 2px; margin-bottom: 50px; }
    .play-btn {
      display: inline-block;
      padding: 18px 60px;
      font-size: 24px;
      font-family: 'Georgia', serif;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #cc3300, #ff6600);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 30px #ff6600aa;
      transition: all 0.2s;
    }
    .play-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px #ff6600; }
    .lb-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 36px;
      font-family: 'Georgia', serif;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 14px;
      transition: all 0.2s;
    }
    .lb-btn:hover { color: #fff; border-color: #ff6600; box-shadow: 0 0 20px #ff660044; }
    .features { display: flex; gap: 40px; margin-top: 60px; flex-wrap: wrap; justify-content: center; }
    .feature { text-align: center; max-width: 160px; }
    .feature span { font-size: 40px; }
    .feature p { margin-top: 10px; color: #aaa; font-size: 14px; letter-spacing: 1px; }
    footer { position: fixed; bottom: 20px; color: #444; font-size: 12px; }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="hero">
    <span class="dragon-emoji">🐉</span>
    <h1>Dragon Run</h1>
    <p class="tagline">Run. Fly. Survive.</p>
    <a href="choose.html" class="play-btn">Play Now</a>
    <br>
    <a href="leaderboard.html" class="lb-btn">🏆 Leaderboard</a>
    <div class="features">
      <div class="feature"><span>🔥</span><p>Breathe fire, destroy obstacles</p></div>
      <div class="feature"><span>⚡</span><p>Lightning fast gameplay</p></div>
      <div class="feature"><span>🏆</span><p>Beat your high score</p></div>
    </div>
  </div>
  <footer>© 2025 Dragon Run</footer>
</body>
</html>
