<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Train Rat</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🐀</text></svg>'>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #6db3e8; font-family: 'Georgia', serif; }
    canvas { display: block; touch-action: none; }
    .overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(5, 5, 12, 0.82);
      color: #fff; text-align: center; z-index: 10; padding: 20px;
    }
    .overlay h1 {
      font-size: clamp(40px, 9vw, 72px);
      letter-spacing: 5px; text-transform: uppercase;
      background: linear-gradient(135deg, #ffcc00, #aaa, #ffcc00);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px #ffcc0066);
      margin-bottom: 4px;
    }
    .logo { width: min(88vw, 470px); filter: drop-shadow(0 0 16px #ffcc0055); margin-bottom: 6px; }
    #brand {
      position: fixed; top: 14px; left: 16px; z-index: 5;
      color: #ffcc00; letter-spacing: 3px; font-size: 13px; font-weight: bold;
      text-shadow: 0 0 8px #000; pointer-events: none;
    }
    .overlay .rat { font-size: clamp(60px, 12vw, 100px); animation: scurry 0.8s ease-in-out infinite; }
    @keyframes scurry { 0%,100% { transform: translateX(-8px) } 50% { transform: translateX(8px) } }
    .overlay p { color: #aaa; letter-spacing: 2px; margin: 10px 0; font-size: 15px; line-height: 1.7; }
    .overlay .big { color: #ffcc00; font-size: 30px; letter-spacing: 3px; }
    .overlay .go-btn {
      margin-top: 24px; padding: 16px 56px; font-size: 22px; font-family: 'Georgia', serif;
      letter-spacing: 3px; text-transform: uppercase; color: #111;
      background: linear-gradient(135deg, #ffcc00, #ff9900);
      border: none; border-radius: 4px; cursor: pointer;
      box-shadow: 0 0 30px #ffcc0088; transition: all 0.2s;
    }
    .overlay .go-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px #ffcc00; }
    .overlay a { color: #666; font-size: 13px; letter-spacing: 2px; margin-top: 26px; text-decoration: none; }
    .overlay a:hover { color: #ffcc00; }
    .nameInput {
      padding: 10px 14px; font-size: 16px; font-family: 'Georgia', serif; text-align: center;
      background: #111; border: 1px solid #333; border-radius: 4px; color: #fff; width: 200px;
    }
    .nameInput:focus { outline: none; border-color: #ffcc00; }
    #saveStatus { color: #ffcc00; font-size: 14px; letter-spacing: 1px; margin-top: 10px; min-height: 18px; }
    #topList { margin-top: 10px; color: #ccc; font-size: 14px; line-height: 1.5; letter-spacing: 1px; min-height: 22px; }
    #hud {
      position: fixed; top: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 28px;
      color: #fff; font-size: 20px; letter-spacing: 2px; z-index: 5; text-shadow: 0 0 8px #000;
      pointer-events: none;
    }
    #hud span b { color: #ffcc00; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="brand" class="hidden">🐀 TRAIN RAT</div>
  <div id="hud" class="hidden"><span>🐀 <b id="hudName"></b></span><span>🧀 <b id="cheeseCt">0</b></span><span>SCORE <b id="scoreCt">0</b></span><span id="pauseBtn" style="pointer-events:auto;cursor:pointer">⏸</span><span id="settingsBtn" style="pointer-events:auto;cursor:pointer">⚙️</span></div>

  <div id="settingsPanel" class="hidden" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#14141f; border:1px solid #333; border-radius:8px; padding:28px 32px; z-index:20; text-align:center; box-shadow:0 0 40px #000;">
    <p style="color:#ffcc00; letter-spacing:3px; font-size:18px; text-transform:uppercase; margin-bottom:18px;">Settings</p>
    <label style="color:#aaa; letter-spacing:2px; font-size:13px;">NAME</label><br>
    <input type="text" id="setName" class="nameInput" maxlength="20" autocomplete="off" style="margin:10px 0 18px;"><br>
    <label style="color:#aaa; letter-spacing:2px; font-size:13px;">GAME SPEED &nbsp;<b id="speedVal" style="color:#ffcc00;">80%</b></label><br>
    <input type="range" id="speedSlider" min="40" max="140" step="10" style="width:220px; margin:14px 0 20px; accent-color:#ffcc00;"><br>
    <label style="color:#aaa; letter-spacing:2px; font-size:13px; display:block; margin-bottom:10px;"><input type="checkbox" id="sfxToggle" style="accent-color:#ffcc00;"> SOUND EFFECTS</label>
    <label style="color:#aaa; letter-spacing:2px; font-size:13px; display:block; margin-bottom:20px;"><input type="checkbox" id="musicToggle" style="accent-color:#ffcc00;"> MUSIC</label>
    <button id="settingsClose" style="padding:10px 36px; font-family:'Georgia',serif; letter-spacing:2px; text-transform:uppercase; color:#111; background:linear-gradient(135deg,#ffcc00,#ff9900); border:none; border-radius:4px; cursor:pointer;">Done</button>
  </div>

  <div class="overlay" id="startScreen">
    <svg class="logo" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Train Rat">
      <defs>
        <linearGradient id="tr-gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe066"/>
          <stop offset="0.55" stop-color="#ffcc00"/>
          <stop offset="1" stop-color="#ff9900"/>
        </linearGradient>
      </defs>
      <!-- running rat over the wordmark -->
      <g transform="translate(452 38)">
        <g stroke="#ffcc0088" stroke-width="4" stroke-linecap="round">
          <line x1="44" y1="-10" x2="66" y2="-10"/>
          <line x1="52" y1="0" x2="78" y2="0"/>
          <line x1="46" y1="10" x2="64" y2="10"/>
        </g>
        <g fill="#ffcc00">
          <path d="M28 2 Q 58 -8 76 8" stroke="#ffcc00" stroke-width="5" fill="none" stroke-linecap="round"/>
          <ellipse cx="0" cy="0" rx="30" ry="15"/>
          <circle cx="-32" cy="-5" r="11"/>
          <polygon points="-41,-8 -56,-3 -41,1"/>
          <circle cx="-34" cy="-15" r="6"/>
          <ellipse cx="-16" cy="13" rx="6" ry="3.5"/>
          <ellipse cx="14" cy="13" rx="7" ry="4"/>
        </g>
      </g>
      <text x="320" y="138" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="86" letter-spacing="8" fill="url(#tr-gold)" stroke="#201400" stroke-width="4" paint-order="stroke">TRAIN RAT</text>
      <!-- the track it rides on -->
      <g fill="#a87400">
        <rect x="88" y="163" width="14" height="44" rx="3"/>
        <rect x="168" y="163" width="14" height="44" rx="3"/>
        <rect x="248" y="163" width="14" height="44" rx="3"/>
        <rect x="328" y="163" width="14" height="44" rx="3"/>
        <rect x="408" y="163" width="14" height="44" rx="3"/>
        <rect x="488" y="163" width="14" height="44" rx="3"/>
      </g>
      <g fill="#ffcc00">
        <rect x="70" y="168" width="450" height="7" rx="3"/>
        <rect x="52" y="194" width="486" height="7" rx="3"/>
      </g>
    </svg>
    <p>Dodge the trains. Grab the cheese. Don't get squished.</p>
    <p>⬅️ ➡️ switch tracks &nbsp;·&nbsp; ⬆️ jump &nbsp;·&nbsp; ⬇️ duck<br>(or swipe on your phone)</p>
    <input type="text" id="startName" class="nameInput" maxlength="20" placeholder="your name" autocomplete="off">
    <button class="go-btn" id="startBtn">Run!</button>
    <a href="#" id="settingsLink">⚙️ settings</a>
    <a href="leaderboard.html">🏆 Leaderboard</a>
    <a href="classic.html">🕹️ classic 2D version</a>
  </div>

  <div class="overlay hidden" id="overScreen">
    <span class="rat" style="animation:none">💀</span>
    <h1>Squished!</h1>
    <p class="big" id="finalScore"></p>
    <p id="saveStatus"></p>
    <div id="topList"></div>
    <button class="go-btn" id="againBtn">Run Again</button>
    <a href="leaderboard.html">🏆 Full leaderboard</a>
  </div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6db3e8);
scene.fog = new THREE.Fog(0xa8cfeb, 60, 150);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 3.4, 7.5);
camera.lookAt(0, 1, -12);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- light ----------
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x5e9c46, 0.9));
const sun = new THREE.DirectionalLight(0xfff2cc, 1.6);
sun.position.set(14, 24, -10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -40;
sun.shadow.camera.far = 80;
scene.add(sun);

// ---------- world ----------
const LANE_X = l => (l - 1) * 2.4;
const WORLD_LEN = 170;        // how far ahead things exist
const mat = {
  grass:  new THREE.MeshStandardMaterial({ color: 0x5e9c46, roughness: 1 }),
  gravel: new THREE.MeshStandardMaterial({ color: 0x9a8a70, roughness: 1 }),
  rail:   new THREE.MeshStandardMaterial({ color: 0xc9ccd4, roughness: 0.35, metalness: 0.7 }),
  tie:    new THREE.MeshStandardMaterial({ color: 0x7a5a3a, roughness: 1 }),
  fur:    new THREE.MeshStandardMaterial({ color: 0x8d93a0, roughness: 0.9 }),
  furDark:new THREE.MeshStandardMaterial({ color: 0x767c88, roughness: 0.9 }),
  pink:   new THREE.MeshStandardMaterial({ color: 0xf0a7b2, roughness: 0.8 }),
  black:  new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 }),
  train:  new THREE.MeshStandardMaterial({ color: 0x49536b, roughness: 0.5, metalness: 0.3 }),
  trainRoof: new THREE.MeshStandardMaterial({ color: 0x2e3542, roughness: 0.6 }),
  glass:  new THREE.MeshStandardMaterial({ color: 0x121620, roughness: 0.2, metalness: 0.5 }),
  light:  new THREE.MeshStandardMaterial({ color: 0xffee99, emissive: 0xffee99, emissiveIntensity: 1.4 }),
  yellow: new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.7 }),
  cheese: new THREE.MeshStandardMaterial({ color: 0xffd34d, emissive: 0x7a5c00, roughness: 0.6 }),
  wood:   new THREE.MeshStandardMaterial({ color: 0x884422, roughness: 1 }),
  steel:  new THREE.MeshStandardMaterial({ color: 0x555f6e, roughness: 0.6, metalness: 0.4 }),
  pole:   new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 1 }),
  cloud:  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, fog: false }),
  hill:   new THREE.MeshStandardMaterial({ color: 0x9fc98e, roughness: 1 }),
};

// ground
const grass = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), mat.grass);
grass.rotation.x = -Math.PI / 2; grass.position.set(0, -0.06, -120);
grass.receiveShadow = true;
scene.add(grass);

const bed = new THREE.Mesh(new THREE.BoxGeometry(9.4, 0.12, 400), mat.gravel);
bed.position.set(0, -0.02, -120);
bed.receiveShadow = true;
scene.add(bed);

// rails: two per track, running the whole length
const railGeo = new THREE.BoxGeometry(0.1, 0.12, 400);
for (let l = 0; l < 3; l++) for (const off of [-0.65, 0.65]) {
  const r = new THREE.Mesh(railGeo, mat.rail);
  r.position.set(LANE_X(l) + off, 0.1, -120);
  r.castShadow = true; r.receiveShadow = true;
  scene.add(r);
}

// ties recycle toward the camera
const ties = [];
const tieGeo = new THREE.BoxGeometry(8.8, 0.09, 0.42);
for (let i = 0; i < 46; i++) {
  const t = new THREE.Mesh(tieGeo, mat.tie);
  t.position.set(0, 0.045, -i * 3.8 + 8);
  t.receiveShadow = true;
  scene.add(t); ties.push(t);
}

// telephone poles recycle too
const poles = [];
function buildPole() {
  const g = new THREE.Group();
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 6.4), mat.pole);
  post.position.y = 3.2; post.castShadow = true;
  const bar = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.14, 0.14), mat.pole);
  bar.position.y = 5.7; bar.castShadow = true;
  g.add(post, bar);
  return g;
}
for (let i = 0; i < 10; i++) for (const side of [-7.5, 7.5]) {
  const p = buildPole();
  p.position.set(side, 0, -i * 18 + 6);
  scene.add(p); poles.push(p);
}

// hills + clouds + sun disc (static dressing)
for (const [x, z, s] of [[-45, -130, 26], [20, -140, 34], [55, -125, 22]]) {
  const h = new THREE.Mesh(new THREE.SphereGeometry(s, 24, 16), mat.hill);
  h.position.set(x, -s * 0.72, z);
  scene.add(h);
}
const clouds = [];
const cloudGeo = new THREE.SphereGeometry(1, 10, 8);
for (let i = 0; i < 6; i++) {
  const c = new THREE.Group();
  for (const [dx, dz, s] of [[0, 0, 2.6], [2.2, 0.3, 1.9], [-2.2, -0.2, 1.7]]) {
    const b = new THREE.Mesh(cloudGeo, mat.cloud);
    b.position.set(dx, 0, dz); b.scale.setScalar(s); b.scale.y = s * 0.55;
    c.add(b);
  }
  c.position.set((i - 2.5) * 22, 15 + (i % 3) * 3, -110 - (i % 2) * 15);
  scene.add(c); clouds.push(c);
}

// ---------- the rat ----------
function buildRat() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 18), mat.fur);
  body.scale.set(0.85, 0.75, 1.25); body.position.set(0, 0.5, 0);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 20, 16), mat.fur);
  head.position.set(0, 0.72, -0.72);
  const snout = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.34, 14), mat.furDark);
  snout.rotation.x = -Math.PI / 2; snout.position.set(0, 0.64, -1.05);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), mat.pink);
  nose.position.set(0, 0.64, -1.22);
  const earGeo = new THREE.SphereGeometry(0.16, 12, 10);
  const earL = new THREE.Mesh(earGeo, mat.pink); earL.scale.z = 0.4; earL.position.set(-0.22, 1.02, -0.68);
  const earR = earL.clone(); earR.position.x = 0.22;
  const haunchGeo = new THREE.SphereGeometry(0.3, 14, 12);
  const haunchL = new THREE.Mesh(haunchGeo, mat.furDark); haunchL.position.set(-0.38, 0.34, 0.42);
  const haunchR = haunchL.clone(); haunchR.position.x = 0.38;
  const footGeo = new THREE.SphereGeometry(0.11, 10, 8);
  const feet = [];
  for (const [x, z] of [[-0.42, 0.55], [0.42, 0.55], [-0.28, -0.6], [0.28, -0.6]]) {
    const f = new THREE.Mesh(footGeo, mat.pink);
    f.scale.set(1, 0.6, 1.4); f.position.set(x, 0.07, z);
    g.add(f); feet.push(f);
  }
  // tail: a pink curve trailing behind
  const tailCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0.4, 0.6), new THREE.Vector3(0, 0.25, 1.3),
    new THREE.Vector3(0.25, 0.12, 1.9), new THREE.Vector3(0.1, 0.06, 2.5),
  ]);
  const tail = new THREE.Mesh(new THREE.TubeGeometry(tailCurve, 20, 0.06, 8), mat.pink);
  g.add(body, head, snout, nose, earL, earR, haunchL, haunchR, tail);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { group: g, tail, feet };
}
const rat = buildRat();
rat.group.position.set(0, 0, 0);
scene.add(rat.group);

// ---------- obstacle builders ----------
const stripeTex = (() => {   // yellow/black hazard stripes for hurdles
  const c = document.createElement('canvas'); c.width = 128; c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = '#ffcc00'; x.fillRect(0, 0, 128, 32);
  x.fillStyle = '#111';
  for (let i = 0; i < 4; i++) { x.save(); x.translate(i * 32 + 8, 0); x.transform(1, 0, -0.5, 1, 0, 0); x.fillRect(0, 0, 16, 32); x.restore(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; return t;
})();
const signTex = (() => {    // LOW CLEARANCE sign face
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#555f6e'; x.fillRect(0, 0, 512, 128);
  x.strokeStyle = '#38404c'; x.lineWidth = 10; x.strokeRect(5, 5, 502, 118);
  x.fillStyle = '#ff5533'; x.font = 'bold 56px Georgia'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('LOW CLEARANCE', 256, 68);
  return new THREE.CanvasTexture(c);
})();

function buildTrain() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 2.3, 9), mat.train);
  body.position.y = 1.45;
  const roof = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 9, 12, 1, false, 0, Math.PI), mat.trainRoof);
  roof.rotation.z = Math.PI / 2; roof.rotation.y = Math.PI / 2; roof.position.y = 2.6;
  const shield = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.7, 0.06), mat.glass);
  shield.position.set(0, 2.1, -4.52);
  for (const sx of [-0.55, 0.55]) {
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), mat.light);
    lamp.position.set(sx, 1.0, -4.55);
    g.add(lamp);
  }
  const bullet = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.06, 20), mat.yellow);
  bullet.rotation.x = Math.PI / 2; bullet.position.set(0, 1.55, -4.55);
  for (const sz of [-3, -1, 1, 3]) {
    const win = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.6, 0.9), mat.glass);
    win.position.set(0, 2.0, sz);
    g.add(win);
  }
  g.add(body, roof, shield, bullet);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}
function buildHurdle() {
  const g = new THREE.Group();
  for (const sx of [-0.8, 0.8]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.8, 0.12), mat.wood);
    post.position.set(sx, 0.4, 0);
    g.add(post);
  }
  const bar = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 0.1),
    new THREE.MeshStandardMaterial({ map: stripeTex, roughness: 0.8 }));
  bar.position.y = 0.72;
  g.add(bar);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}
function buildBeam() {
  const g = new THREE.Group();
  for (const sx of [-1.0, 1.0]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, 2.6, 0.16), mat.steel);
    post.position.set(sx, 1.3, 0);
    g.add(post);
  }
  const sign = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.55, 0.1),
    new THREE.MeshStandardMaterial({ map: signTex, roughness: 0.8 }));
  sign.position.y = 1.55;
  g.add(sign);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}
const cheeseGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.26, 3);
function buildCheese() {
  const m = new THREE.Mesh(cheeseGeo, mat.cheese);
  m.rotation.z = Math.PI / 2; m.castShadow = true;
  return m;
}

// ---------- game state ----------
let playing = false, paused = false, elapsed = 0, score = 0, cheese = 0;
let lane = 1, displayLane = 1;
let jumpT = -1, duckT = -1;
const JUMP_DUR = 0.6, DUCK_DUR = 0.6;
let obstacles = [], treats = [], spawnTimer = 0;
let speedMult = parseFloat(localStorage.getItem('subwayRatsSpeed') || '0.8');
function speed() { return (13 + Math.min(22, elapsed * 0.33)) * speedMult; }   // world units/sec

function reset() {
  elapsed = 0; score = 0; cheese = 0;
  lane = 1; displayLane = 1; jumpT = -1; duckT = -1;
  for (const o of obstacles) scene.remove(o.mesh);
  for (const t of treats) scene.remove(t.mesh);
  obstacles = []; treats = []; spawnTimer = 0.8;
}

function spawnWave() {
  const order = [0, 1, 2].sort(() => Math.random() - 0.5);
  const nBlocked = Math.random() < (0.35 + Math.min(0.3, elapsed * 0.006)) ? 2 : 1;
  for (let i = 0; i < nBlocked; i++) {
    const r = Math.random();
    const type = r < 0.32 ? 'train' : r < 0.66 ? 'hurdle' : 'beam';
    const mesh = type === 'train' ? buildTrain() : type === 'hurdle' ? buildHurdle() : buildBeam();
    mesh.position.set(LANE_X(order[i]), 0, -WORLD_LEN + (type === 'train' ? -4.5 : 0));
    scene.add(mesh);
    obstacles.push({ mesh, lane: order[i], type, len: type === 'train' ? 9 : 0.4 });
  }
  if (Math.random() < 0.65) {
    const open = order[nBlocked];
    const n = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const m = buildCheese();
      m.position.set(LANE_X(open), 0.5, -WORLD_LEN - i * 4);
      scene.add(m);
      treats.push({ mesh: m, lane: open });
    }
  }
}

// ---------- update ----------
function update(dt) {
  elapsed += dt;
  const v = speed();
  score += dt * 60 * (v / 13);

  displayLane += (lane - displayLane) * Math.min(1, dt * 12);
  if (jumpT >= 0 && (jumpT += dt) > JUMP_DUR) jumpT = -1;
  if (duckT >= 0 && (duckT += dt) > DUCK_DUR) duckT = -1;

  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnWave(); spawnTimer = 26 / v; }

  // move world objects toward the camera
  for (const o of obstacles) o.mesh.position.z += v * dt;
  for (const t of treats) { t.mesh.position.z += v * dt; t.mesh.rotation.y += dt * 3; }
  obstacles = obstacles.filter(o => {
    if (o.mesh.position.z - o.len / 2 > 10) { scene.remove(o.mesh); return false; }
    return true;
  });

  // scenery recycle
  for (const t of ties) { t.position.z += v * dt; if (t.position.z > 10) t.position.z -= 46 * 3.8; }
  for (const p of poles) { p.position.z += v * dt; if (p.position.z > 10) p.position.z -= 10 * 18; }
  for (const c of clouds) { c.position.x += dt * 0.4; if (c.position.x > 70) c.position.x = -70; }

  const jumpH = jumpT >= 0 ? Math.sin(Math.PI * jumpT / JUMP_DUR) : 0;
  const ducking = duckT >= 0;

  // rat pose: scamper-hop gait carried over from the 2D game
  const phase = (elapsed * 3.3 * (v / 13)) % 1;
  const hop = jumpT < 0 && !ducking ? Math.abs(Math.sin(phase * Math.PI)) : 0;
  rat.group.position.x = LANE_X(displayLane);
  rat.group.position.y = jumpH * 2.0 + hop * 0.22;
  rat.group.rotation.z = (displayLane - lane) * 0.3;
  if (ducking) rat.group.scale.set(1.25, 0.5, 1.1);
  else if (jumpT >= 0) rat.group.scale.set(0.95, 1.12, 1);
  else rat.group.scale.set(1, 0.92 + 0.16 * hop, 1);
  rat.tail.rotation.y = Math.sin(phase * Math.PI * 2) * 0.5;
  rat.feet.forEach((f, i) => { f.position.y = 0.07 + Math.max(0, Math.sin(phase * Math.PI * 4 + i * Math.PI)) * 0.12; });

  // collisions — the rat sits at z=0
  for (const o of obstacles) {
    if (Math.abs(displayLane - o.lane) > 0.45) continue;
    const zF = o.mesh.position.z - o.len / 2, zB = o.mesh.position.z + o.len / 2;
    if (zF > 0.9 || zB < -0.9) continue;
    if (o.type === 'hurdle' && jumpH > 0.4) continue;
    if (o.type === 'beam' && ducking) continue;
    return gameOver();
  }
  treats = treats.filter(t => {
    if (Math.abs(displayLane - t.lane) <= 0.45 && Math.abs(t.mesh.position.z) < 1.1) {
      cheese++; score += 25; sfx.cheese(); scene.remove(t.mesh); return false;
    }
    if (t.mesh.position.z > 10) { scene.remove(t.mesh); return false; }
    return true;
  });

  document.getElementById('cheeseCt').textContent = cheese;
  document.getElementById('scoreCt').textContent = Math.floor(score);
}

// ---------- loop ----------
const clock = new THREE.Clock();
function frame() {
  if (!playing || paused) return;
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  renderer.render(scene, camera);
}

function start() {
  if (!document.getElementById('startScreen').classList.contains('hidden')) setName(startName.value);
  if (!ratName) { startName.focus(); startName.style.borderColor = '#ff5533'; startName.placeholder = 'name first!'; return; }
  reset();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('brand').classList.remove('hidden');
  playing = true; paused = false;
  audio();   // unlock the audio context on the Run tap, whatever the music setting
  startMusic();
  clock.getDelta();
  frame();
}
function gameOver() {
  playing = false;
  stopMusic(); sfx.crash();
  const s = Math.floor(score);
  const best = Math.max(s, parseInt(localStorage.getItem('subwayRatsHigh') || '0', 10));
  localStorage.setItem('subwayRatsHigh', best);
  document.getElementById('finalScore').textContent = `${s} points · ${cheese} 🧀 · best ${best}`;
  autoSave(s);
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('brand').classList.add('hidden');
  document.getElementById('overScreen').classList.remove('hidden');
  renderer.render(scene, camera);
}

// ---------- leaderboard (shared scoreboard API; one row per name, best score kept) ----------
const API = 'https://dev.brasstix.com/bktrg/leaderboard.php';
let ratName = localStorage.getItem('ratName') || '';
const startName = document.getElementById('startName');
const setNameInput = document.getElementById('setName');
function setName(n) {
  ratName = n.trim().slice(0, 20);
  localStorage.setItem('ratName', ratName);
  document.getElementById('hudName').textContent = ratName;
  startName.value = ratName; setNameInput.value = ratName;
}
setName(ratName);
startName.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
setNameInput.addEventListener('change', () => setName(setNameInput.value));

async function renderTop() {
  const el = document.getElementById('topList');
  try {
    const rows = await (await fetch(API)).json();
    el.textContent = '';
    if (!rows.length) { el.textContent = 'No scores yet — be the first!'; return; }
    const medals = ['🥇', '🥈', '🥉'];
    rows.slice(0, 10).forEach((r, i) => {
      const d = document.createElement('div');
      d.textContent = `${medals[i] || (i + 1) + '.'} ${r.name} — ${r.score.toLocaleString()}`;
      el.appendChild(d);
    });
  } catch { el.textContent = "Couldn't load the leaderboard."; }
}
async function autoSave(s) {
  const el = document.getElementById('saveStatus');
  if (!ratName || s <= 0) { el.textContent = ''; renderTop(); return; }
  el.textContent = 'Saving score…';
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: ratName, score: s }),
    });
    if (!res.ok) throw 0;
    const j = await res.json();
    el.textContent = j.rank ? `Saved — ${ratName} is #${j.rank} 🧀` : 'Saved ✓';
  } catch { el.textContent = "Couldn't reach the leaderboard"; }
  renderTop();
}

// ---------- settings panel ----------
const settingsPanel = document.getElementById('settingsPanel');
const speedSlider = document.getElementById('speedSlider');
let resumeAfterSettings = false;
function openSettings() {
  if (playing && !paused) { togglePause(); resumeAfterSettings = true; } else resumeAfterSettings = false;
  speedSlider.value = Math.round(speedMult * 100);
  document.getElementById('speedVal').textContent = speedSlider.value + '%';
  setNameInput.value = ratName;
  settingsPanel.classList.remove('hidden');
}
function closeSettings() {
  settingsPanel.classList.add('hidden');
  if (resumeAfterSettings && playing && paused) togglePause();
}
speedSlider.addEventListener('input', () => {
  speedMult = speedSlider.value / 100;
  localStorage.setItem('subwayRatsSpeed', speedMult);
  document.getElementById('speedVal').textContent = speedSlider.value + '%';
});
const sfxToggle = document.getElementById('sfxToggle'), musicToggle = document.getElementById('musicToggle');
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsLink').addEventListener('click', e => { e.preventDefault(); openSettings(); });
document.getElementById('settingsClose').addEventListener('click', closeSettings);
function togglePause() {
  if (!playing) return;
  paused = !paused;
  if (paused) stopMusic();
  else { startMusic(); clock.getDelta(); frame(); }
}

// ---------- audio (same synth as the 2D game) ----------
let AC = null;
let sfxOn = localStorage.getItem('subwayRatsSfx') !== '0';
let musicOn = localStorage.getItem('subwayRatsMusic') !== '0';
function audio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol, at) {
  const ac = audio(), t = at || ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  jump:   () => sfxOn && tone(300, 680, 0.16, 'square', 0.12),
  duck:   () => sfxOn && tone(420, 160, 0.12, 'square', 0.10),
  lane:   () => sfxOn && tone(240, 320, 0.06, 'triangle', 0.10),
  cheese: () => { if (!sfxOn) return; const t = audio().currentTime; tone(880, 880, 0.07, 'sine', 0.14, t); tone(1318.5, 1318.5, 0.12, 'sine', 0.12, t + 0.07); },
  crash:  () => { if (!sfxOn) return; tone(350, 55, 0.5, 'sawtooth', 0.22); tone(180, 40, 0.5, 'square', 0.16); },
};
const BASS = [110, 0, 110, 0, 130.8, 0, 110, 0, 98, 0, 98, 0, 116.5, 0, 123.5, 0];
const LEAD = [0, 0, 440, 0, 523.3, 0, 440, 0, 0, 392, 0, 466.2, 440, 0, 0, 0];
let musicTimer = null, nextStep = 0, stepIdx = 0;
function pumpMusic() {
  const ac = audio(), stepDur = 60 / 108 / 2;
  if (nextStep < ac.currentTime) nextStep = ac.currentTime + 0.05;
  while (nextStep < ac.currentTime + 0.35) {
    const b = BASS[stepIdx % 16], l = LEAD[stepIdx % 16];
    if (b) tone(b, b, stepDur * 0.9, 'triangle', 0.11, nextStep);
    if (l) tone(l, l, stepDur * 0.7, 'square', 0.035, nextStep);
    if (stepIdx % 4 === 2) tone(6000, 5000, 0.03, 'square', 0.02, nextStep);
    nextStep += stepDur; stepIdx++;
  }
}
function startMusic() { if (!musicOn || musicTimer) return; audio(); nextStep = 0; musicTimer = setInterval(pumpMusic, 120); pumpMusic(); }
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }
sfxToggle.checked = sfxOn; musicToggle.checked = musicOn;
sfxToggle.addEventListener('change', () => {
  sfxOn = sfxToggle.checked;
  localStorage.setItem('subwayRatsSfx', sfxOn ? '1' : '0');
});
musicToggle.addEventListener('change', () => {
  musicOn = musicToggle.checked;
  localStorage.setItem('subwayRatsMusic', musicOn ? '1' : '0');
  if (!musicOn) stopMusic(); else if (playing && !paused) startMusic();
});

// ---------- input ----------
function act(dir) {
  if (!playing || paused) return;
  if (dir === 'left' && lane > 0) { lane--; sfx.lane(); }
  if (dir === 'right' && lane < 2) { lane++; sfx.lane(); }
  if (dir === 'up' && jumpT < 0) { jumpT = 0; duckT = -1; sfx.jump(); }
  if (dir === 'down' && duckT < 0) { duckT = 0; jumpT = -1; sfx.duck(); }
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { e.preventDefault(); togglePause(); return; }
  const map = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right',
                ArrowUp: 'up', w: 'up', ' ': 'up', ArrowDown: 'down', s: 'down' };
  if (map[e.key] !== undefined) { e.preventDefault(); act(map[e.key]); }
});
let touchX = 0, touchY = 0;
addEventListener('touchstart', e => {
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
}, { passive: true });
addEventListener('touchend', e => {
  if (e.target.closest && e.target.closest('#pauseBtn, #settingsBtn, #settingsPanel, .overlay')) return;
  if (paused) { if (settingsPanel.classList.contains('hidden')) togglePause(); return; }
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) { act('up'); return; }
  if (Math.abs(dx) > Math.abs(dy)) act(dx > 0 ? 'right' : 'left');
  else act(dy > 0 ? 'down' : 'up');
}, { passive: true });

document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('againBtn').addEventListener('click', start);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopMusic();
  else if (playing && !paused) { startMusic(); clock.getDelta(); }
});

// idle scene behind the start screen
renderer.render(scene, camera);
</script>
</body>
</html>
