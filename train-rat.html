<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Train Rat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0a0a12; font-family: 'Georgia', serif; }
    canvas { display: block; touch-action: none; }
    .overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(5, 5, 12, 0.82);
      color: #fff; text-align: center; z-index: 10; padding: 20px;
    }
    .overlay h1 {
      font-size: clamp(40px, 9vw, 72px);
      letter-spacing: 5px; text-transform: uppercase;
      background: linear-gradient(135deg, #ffcc00, #aaa, #ffcc00);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px #ffcc0066);
      margin-bottom: 4px;
    }
    .overlay .rat { font-size: clamp(60px, 12vw, 100px); animation: scurry 0.8s ease-in-out infinite; }
    @keyframes scurry { 0%,100% { transform: translateX(-8px) } 50% { transform: translateX(8px) } }
    .overlay p { color: #aaa; letter-spacing: 2px; margin: 10px 0; font-size: 15px; line-height: 1.7; }
    .overlay .big { color: #ffcc00; font-size: 30px; letter-spacing: 3px; }
    .overlay .go-btn {
      margin-top: 24px; padding: 16px 56px; font-size: 22px; font-family: 'Georgia', serif;
      letter-spacing: 3px; text-transform: uppercase; color: #111;
      background: linear-gradient(135deg, #ffcc00, #ff9900);
      border: none; border-radius: 4px; cursor: pointer;
      box-shadow: 0 0 30px #ffcc0088; transition: all 0.2s;
    }
    .overlay .go-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px #ffcc00; }
    .overlay a { color: #666; font-size: 13px; letter-spacing: 2px; margin-top: 26px; text-decoration: none; }
    .overlay a:hover { color: #ffcc00; }
    #hud {
      position: fixed; top: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 28px;
      color: #fff; font-size: 20px; letter-spacing: 2px; z-index: 5; text-shadow: 0 0 8px #000;
      pointer-events: none;
    }
    #hud span b { color: #ffcc00; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" class="hidden"><span>🧀 <b id="cheeseCt">0</b></span><span>SCORE <b id="scoreCt">0</b></span><span id="pauseBtn" style="pointer-events:auto;cursor:pointer">⏸</span><span id="settingsBtn" style="pointer-events:auto;cursor:pointer">⚙️</span></div>

  <div id="settingsPanel" class="hidden" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#14141f; border:1px solid #333; border-radius:8px; padding:28px 32px; z-index:20; text-align:center; box-shadow:0 0 40px #000;">
    <p style="color:#ffcc00; letter-spacing:3px; font-size:18px; text-transform:uppercase; margin-bottom:18px;">Settings</p>
    <label style="color:#aaa; letter-spacing:2px; font-size:13px;">GAME SPEED &nbsp;<b id="speedVal" style="color:#ffcc00;">80%</b></label><br>
    <input type="range" id="speedSlider" min="40" max="140" step="10" style="width:220px; margin:14px 0 20px; accent-color:#ffcc00;"><br>
    <label style="color:#aaa; letter-spacing:2px; font-size:13px; display:block; margin-bottom:10px;"><input type="checkbox" id="sfxToggle" style="accent-color:#ffcc00;"> SOUND EFFECTS</label>
    <label style="color:#aaa; letter-spacing:2px; font-size:13px; display:block; margin-bottom:20px;"><input type="checkbox" id="musicToggle" style="accent-color:#ffcc00;"> MUSIC</label>
    <button id="settingsClose" style="padding:10px 36px; font-family:'Georgia',serif; letter-spacing:2px; text-transform:uppercase; color:#111; background:linear-gradient(135deg,#ffcc00,#ff9900); border:none; border-radius:4px; cursor:pointer;">Done</button>
  </div>

  <div class="overlay" id="startScreen">
    <span class="rat">🐀</span>
    <h1>Train Rat</h1>
    <p>Dodge the trains. Grab the cheese. Don't get squished.</p>
    <p>⬅️ ➡️ switch tracks &nbsp;·&nbsp; ⬆️ jump &nbsp;·&nbsp; ⬇️ duck<br>(or swipe on your phone)</p>
    <button class="go-btn" id="startBtn">Run!</button>
    <a href="#" id="settingsLink" onclick="openSettings(); return false;">⚙️ settings</a>
    <a href="index.html">← back to bktrg.com</a>
  </div>

  <div class="overlay hidden" id="overScreen">
    <span class="rat" style="animation:none">💀</span>
    <h1>Squished!</h1>
    <p class="big" id="finalScore"></p>
    <p id="bestScore"></p>
    <button class="go-btn" id="againBtn">Run Again</button>
    <a href="index.html">← back to bktrg.com</a>
  </div>

<script>
const cv = document.getElementById('game');
const cx2 = cv.getContext('2d');
let W = 0, H = 0;
function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// ---------- game state ----------
const LANES = 3;
let playing = false, elapsed = 0, travel = 0, score = 0, cheese = 0;
let lane = 1, displayLane = 1;             // 0..2, displayLane eases toward lane
let jumpT = -1, duckT = -1;                // -1 = inactive, else seconds in progress
const JUMP_DUR = 0.55, DUCK_DUR = 0.6;
let obstacles = [], treats = [], spawnTimer = 0;
let lastTime = 0;

// perspective: z=0 at the rat, 1 at the tunnel mouth. p = screen scale factor.
const pOf = z => 1 / (1 + z * 4);
const horizonY = () => H * 0.30;
const playerY  = () => H * 0.84;
const laneHalf = () => Math.min(W, H * 0.9) * 0.30;
const groundY  = p => horizonY() + (playerY() - horizonY()) * ((p - 0.2) / 0.8);
const laneX    = (ln, p) => W / 2 + (ln - 1) * laneHalf() * p;

let speedMult = parseFloat(localStorage.getItem('subwayRatsSpeed') || '0.8');
function speed() { return (0.30 + Math.min(0.55, elapsed * 0.008)) * speedMult; }

function reset() {
  elapsed = 0; travel = 0; score = 0; cheese = 0;
  lane = 1; displayLane = 1; jumpT = -1; duckT = -1;
  obstacles = []; treats = []; spawnTimer = 0.6;
}

// ---------- spawning ----------
function spawnWave() {
  const order = [0, 1, 2].sort(() => Math.random() - 0.5);
  const nBlocked = Math.random() < (0.35 + Math.min(0.3, elapsed * 0.006)) ? 2 : 1;
  for (let i = 0; i < nBlocked; i++) {
    const r = Math.random();
    const type = r < 0.32 ? 'train' : r < 0.66 ? 'hurdle' : 'beam';
    obstacles.push({ lane: order[i], z: 1.05, len: type === 'train' ? 0.5 : 0.03, type });
  }
  // cheese trail down an open lane
  if (Math.random() < 0.65) {
    const open = order[nBlocked];
    const n = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) treats.push({ lane: open, z: 1.05 + i * 0.09 });
  }
}

// ---------- update ----------
function update(dt) {
  elapsed += dt;
  const v = speed();
  travel += v * dt;
  score += dt * 60 * (v / 0.42);

  displayLane += (lane - displayLane) * Math.min(1, dt * 12);
  if (jumpT >= 0 && (jumpT += dt) > JUMP_DUR) jumpT = -1;
  if (duckT >= 0 && (duckT += dt) > DUCK_DUR) duckT = -1;

  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnWave(); spawnTimer = 0.55 / v; }

  for (const o of obstacles) o.z -= v * dt;
  for (const t of treats) t.z -= v * dt;
  obstacles = obstacles.filter(o => o.z + o.len > -0.1);

  const jumpH = jumpT >= 0 ? Math.sin(Math.PI * jumpT / JUMP_DUR) : 0;
  const ducking = duckT >= 0;

  // collisions — rat occupies z ≈ [0, 0.05] in its lane
  for (const o of obstacles) {
    if (Math.abs(displayLane - o.lane) > 0.45) continue;
    if (o.z > 0.05 || o.z + o.len < -0.01) continue;
    if (o.type === 'hurdle' && jumpH > 0.4) continue;   // cleared it in the air
    if (o.type === 'beam' && ducking) continue;          // slid under it
    return gameOver();
  }
  treats = treats.filter(t => {
    if (Math.abs(displayLane - t.lane) <= 0.45 && t.z <= 0.05 && t.z > -0.05) {
      cheese++; score += 25; sfx.cheese(); return false;
    }
    return t.z > -0.1;
  });

  document.getElementById('cheeseCt').textContent = cheese;
  document.getElementById('scoreCt').textContent = Math.floor(score);
}

// ---------- drawing ----------
function drawTunnel() {   // above ground now — sky, hills, grass, gravel track bed
  const hy = horizonY();

  // sky
  const sky = cx2.createLinearGradient(0, 0, 0, hy);
  sky.addColorStop(0, '#5fa8e0'); sky.addColorStop(1, '#c3e2f7');
  cx2.fillStyle = sky;
  cx2.fillRect(0, 0, W, hy + 2);

  // sun
  cx2.fillStyle = '#fff3b0'; cx2.shadowColor = '#fff3b0'; cx2.shadowBlur = 40;
  cx2.beginPath(); cx2.arc(W * 0.82, hy * 0.32, H * 0.045, 0, Math.PI * 2); cx2.fill();
  cx2.shadowBlur = 0;

  // clouds drifting slowly
  cx2.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 0; i < 4; i++) {
    const cxp = (((i * 0.27 + elapsed * 0.006 * (1 + i * 0.4)) % 1.2) - 0.1) * W;
    const cyp = hy * (0.2 + 0.16 * (i % 3));
    for (const [dx, r] of [[0, 1], [0.9, 0.75], [-0.9, 0.7]]) {
      cx2.beginPath();
      cx2.ellipse(cxp + dx * H * 0.05, cyp, H * 0.07 * r, H * 0.038 * r, 0, 0, Math.PI * 2);
      cx2.fill();
    }
  }

  // distant hills on the horizon
  cx2.fillStyle = '#9fc98e';
  cx2.beginPath();
  cx2.moveTo(0, hy);
  cx2.quadraticCurveTo(W * 0.22, hy - H * 0.045, W * 0.45, hy);
  cx2.quadraticCurveTo(W * 0.72, hy - H * 0.06, W, hy);
  cx2.lineTo(W, hy + 2); cx2.lineTo(0, hy + 2);
  cx2.fill();

  // grass
  const grass = cx2.createLinearGradient(0, hy, 0, H);
  grass.addColorStop(0, '#7ab55f'); grass.addColorStop(1, '#4e8a3a');
  cx2.fillStyle = grass;
  cx2.fillRect(0, hy, W, H - hy);

  // gravel track bed
  cx2.fillStyle = '#9a8a70';
  cx2.beginPath();
  cx2.moveTo(laneX(-0.7, pOf(1)), groundY(pOf(1)));
  cx2.lineTo(laneX(2.7, pOf(1)), groundY(pOf(1)));
  cx2.lineTo(laneX(2.7, 1), H);
  cx2.lineTo(laneX(-0.7, 1), H);
  cx2.fill();

  // wooden ties sweeping toward the viewer
  cx2.strokeStyle = '#7a5a3a'; cx2.lineWidth = Math.max(2.5, H / 200);
  for (let i = 0; i < 14; i++) {
    const z = ((i / 14 - travel) % 1 + 1) % 1;
    const p = pOf(z);
    cx2.beginPath();
    cx2.moveTo(laneX(-0.55, p), groundY(p));
    cx2.lineTo(laneX(2.55, p), groundY(p));
    cx2.stroke();
  }

  // steel rails: two per track, over the ties
  cx2.strokeStyle = '#d8dde6'; cx2.lineWidth = Math.max(1.5, H / 400);
  for (let ln = 0; ln < LANES; ln++) {
    for (const off of [-0.3, 0.3]) {
      cx2.beginPath();
      cx2.moveTo(laneX(ln + off, pOf(1)), groundY(pOf(1)));
      cx2.lineTo(laneX(ln + off, 1), H);
      cx2.stroke();
    }
  }

  // telephone poles streaming past on both sides
  cx2.strokeStyle = '#6b4a2f';
  for (let i = 0; i < 7; i++) {
    const z = ((i / 7 - travel * 0.9) % 1 + 1) % 1;
    const p = pOf(z);
    const gy = groundY(p);
    const ph = H * 0.34 * p;
    cx2.lineWidth = Math.max(1.5, 7 * p);
    for (const side of [-1.9, 4.9]) {
      const px = laneX(side, p);
      cx2.beginPath(); cx2.moveTo(px, gy); cx2.lineTo(px, gy - ph); cx2.stroke();
      cx2.beginPath(); cx2.moveTo(px - ph * 0.18, gy - ph * 0.88); cx2.lineTo(px + ph * 0.18, gy - ph * 0.88); cx2.stroke();
    }
  }
}

function drawTrain(o) {
  const zF = Math.max(o.z, 0), zB = o.z + o.len;
  const pF = pOf(zF), pB = pOf(zB);
  const yF = groundY(pF), yB = groundY(pB);
  const wF = laneHalf() * pF * 0.44, wB = laneHalf() * pB * 0.44;
  const hF = H * 0.26 * pF, hB = H * 0.26 * pB;
  const xF = laneX(o.lane, pF), xB = laneX(o.lane, pB);
  // roof back to front
  cx2.fillStyle = '#2e3542';
  cx2.beginPath();
  cx2.moveTo(xB - wB, yB - hB); cx2.lineTo(xB + wB, yB - hB);
  cx2.lineTo(xF + wF, yF - hF); cx2.lineTo(xF - wF, yF - hF);
  cx2.fill();
  // face
  const grad = cx2.createLinearGradient(xF, yF - hF, xF, yF);
  grad.addColorStop(0, '#49536b'); grad.addColorStop(1, '#2b3140');
  cx2.fillStyle = grad;
  cx2.fillRect(xF - wF, yF - hF, wF * 2, hF);
  // windshield
  cx2.fillStyle = '#121620';
  cx2.fillRect(xF - wF * 0.72, yF - hF * 0.92, wF * 1.44, hF * 0.34);
  // headlights
  cx2.fillStyle = '#ffee99'; cx2.shadowColor = '#ffee99'; cx2.shadowBlur = 18 * pF;
  cx2.beginPath(); cx2.arc(xF - wF * 0.55, yF - hF * 0.28, wF * 0.13, 0, Math.PI * 2); cx2.fill();
  cx2.beginPath(); cx2.arc(xF + wF * 0.55, yF - hF * 0.28, wF * 0.13, 0, Math.PI * 2); cx2.fill();
  cx2.shadowBlur = 0;
  // route bullet, NYC style
  cx2.fillStyle = '#ffcc00';
  cx2.beginPath(); cx2.arc(xF, yF - hF * 0.25, wF * 0.16, 0, Math.PI * 2); cx2.fill();
  cx2.fillStyle = '#111';
  cx2.font = `bold ${Math.max(8, wF * 0.22)}px Georgia`;
  cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
  cx2.fillText('R', xF, yF - hF * 0.25);
}

function drawHurdle(o) {
  const p = pOf(Math.max(o.z, 0));
  const x = laneX(o.lane, p), y = groundY(p);
  const w = laneHalf() * p * 0.42, h = H * 0.075 * p;
  cx2.fillStyle = '#884422';
  cx2.fillRect(x - w, y - h, w * 0.12, h);
  cx2.fillRect(x + w * 0.88, y - h, w * 0.12, h);
  // striped bar
  cx2.fillStyle = '#ffcc00';
  cx2.fillRect(x - w, y - h, w * 2, h * 0.45);
  cx2.fillStyle = '#111';
  for (let i = 0; i < 4; i++)
    cx2.fillRect(x - w + (i * 2 + 0.5) * w / 4, y - h, w / 4 * 0.9, h * 0.45);
}

function drawBeam(o) {
  const p = pOf(Math.max(o.z, 0));
  const x = laneX(o.lane, p), y = groundY(p);
  const w = laneHalf() * p * 0.5;
  const top = y - H * 0.21 * p, bot = y - H * 0.115 * p;
  cx2.fillStyle = '#555f6e';
  cx2.fillRect(x - w, top, w * 2, bot - top);
  cx2.fillStyle = '#ff5533';
  cx2.font = `bold ${Math.max(7, (bot - top) * 0.55)}px Georgia`;
  cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
  cx2.fillText('LOW CLEARANCE', x, (top + bot) / 2);
}

function drawTreat(t) {
  const p = pOf(Math.max(t.z, 0));
  cx2.font = `${Math.max(10, H * 0.045 * p)}px serif`;
  cx2.textAlign = 'center'; cx2.textBaseline = 'bottom';
  const bob = Math.sin(elapsed * 6 + t.z * 20) * 4 * p;
  cx2.fillText('🧀', laneX(t.lane, p), groundY(p) - H * 0.01 * p + bob);
}

function drawRat() {
  const jumpH = jumpT >= 0 ? Math.sin(Math.PI * jumpT / JUMP_DUR) : 0;
  const ducking = duckT >= 0;
  const x = laneX(displayLane, 1);

  // Thomas's pick, A+B mix: Hopper's bounce at Scamper's tempo — quick low hops, light squash, paws ticking at double time
  const phase = (elapsed * 3.3 * (speed() / 0.30)) % 1;
  const hop = jumpT < 0 && !ducking ? Math.abs(Math.sin(phase * Math.PI)) : 0;
  const y = playerY() - jumpH * H * 0.16 - hop * H * 0.026;

  let sx = 1, sy = 1;
  if (ducking) { sx = 1.3; sy = 0.55; }
  else if (jumpT >= 0) { sy = 1 + 0.18 * jumpH; sx = 1 - 0.08 * jumpH; }
  else {
    sy = 0.9 + 0.2 * hop; sx = 2 - sy;
    const fwd = 1 - 0.06 * hop;           // shrink a touch at the leap's peak = moving ahead
    sx *= fwd; sy *= fwd;
  }

  // shadow
  const lift = Math.max(jumpH, hop * 0.25);
  cx2.fillStyle = `rgba(0,0,0,${0.5 - lift * 0.3})`;
  cx2.beginPath();
  cx2.ellipse(x, playerY() + H * 0.012, H * 0.045 * (1 - lift * 0.4), H * 0.012, 0, 0, Math.PI * 2);
  cx2.fill();

  // the rat, seen from behind: tail toward the camera, rump, head + ears peeking over it
  cx2.save();
  cx2.translate(x, y);
  cx2.scale(sx, sy);
  const S = H * 0.085;
  const sway = Math.sin(phase * Math.PI * 2);
  const tick = Math.sin(phase * Math.PI * 4);   // paws move at double time, Scamper-style

  // tail — whips side to side with the gait
  cx2.strokeStyle = '#e8a7b0';
  cx2.lineCap = 'round';
  cx2.lineWidth = S * 0.055;
  cx2.beginPath();
  cx2.moveTo(0, -S * 0.12);
  cx2.quadraticCurveTo(sway * S * 0.3, S * 0.18, sway * S * 0.5, S * 0.4);
  cx2.stroke();

  // front paws — ticking quickly past the head, stretched far out on a big jump
  const reach = 0.35 + jumpH * 0.9;
  for (const side of [-1, 1]) {
    const alt = tick * side * 0.1;
    const px = side * S * (0.13 + 0.09 * reach);
    const py = -S * (0.92 + 0.28 * reach + alt);
    cx2.fillStyle = '#9aa0ab';
    cx2.beginPath(); cx2.ellipse(px, py, S * 0.065, S * 0.1, side * 0.3, 0, Math.PI * 2); cx2.fill();
    cx2.fillStyle = '#f0a7b2';
    cx2.beginPath(); cx2.ellipse(px, py - S * 0.07, S * 0.05, S * 0.045, 0, 0, Math.PI * 2); cx2.fill();
  }

  // hind feet — quick alternating scamper
  cx2.fillStyle = '#f0a7b2';
  for (const side of [-1, 1]) {
    cx2.beginPath();
    cx2.ellipse(side * S * 0.34, -S * 0.04 + tick * side * S * 0.06, S * 0.1, S * 0.05, 0, 0, Math.PI * 2);
    cx2.fill();
  }

  // haunches
  cx2.fillStyle = '#7d8390';
  for (const side of [-1, 1]) {
    const bulge = 1 + 0.12 * (1 - hop);
    cx2.beginPath();
    cx2.ellipse(side * S * 0.3, -S * 0.26, S * 0.17 * bulge, S * 0.22 * bulge, side * 0.3, 0, Math.PI * 2);
    cx2.fill();
  }

  // rump
  const bg = cx2.createRadialGradient(-S * 0.12, -S * 0.52, S * 0.05, 0, -S * 0.38, S * 0.52);
  bg.addColorStop(0, '#b9bfca'); bg.addColorStop(1, '#848a96');
  cx2.fillStyle = bg;
  cx2.beginPath();
  cx2.ellipse(0, -S * 0.38, S * 0.42, S * 0.38, 0, 0, Math.PI * 2);
  cx2.fill();

  // head peeking over the rump
  cx2.fillStyle = '#8d93a0';
  cx2.beginPath();
  cx2.arc(0, -S * 0.8, S * 0.2, 0, Math.PI * 2);
  cx2.fill();

  // ears, pink inside
  for (const side of [-1, 1]) {
    cx2.fillStyle = '#8d93a0';
    cx2.beginPath();
    cx2.arc(side * S * 0.17, -S * 0.97, S * 0.105, 0, Math.PI * 2);
    cx2.fill();
    cx2.fillStyle = '#f0a7b2';
    cx2.beginPath();
    cx2.arc(side * S * 0.17, -S * 0.97, S * 0.055, 0, Math.PI * 2);
    cx2.fill();
  }
  cx2.restore();
}

function draw() {
  drawTunnel();
  const all = [
    ...obstacles.map(o => ({ z: o.z, fn: () => (o.type === 'train' ? drawTrain : o.type === 'hurdle' ? drawHurdle : drawBeam)(o) })),
    ...treats.map(t => ({ z: t.z, fn: () => drawTreat(t) })),
  ].sort((a, b) => b.z - a.z);
  for (const d of all) d.fn();
  drawRat();
}

// ---------- loop ----------
let paused = false;
function togglePause() {
  if (!playing) return;
  paused = !paused;
  if (paused) {
    stopMusic();
    cx2.fillStyle = '#ffcc00';
    cx2.font = '16px Georgia'; cx2.textAlign = 'center'; cx2.textBaseline = 'bottom';
    cx2.fillText('⏸ paused — press P or tap ⏸ to resume', W / 2, H - 10);
  } else {
    startMusic();
    lastTime = performance.now();
    requestAnimationFrame(frame);
  }
}
function frame(ts) {
  if (!playing || paused) return;
  const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0);
  lastTime = ts;
  update(dt);
  if (playing) { draw(); requestAnimationFrame(frame); }
}

function start() {
  reset();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  playing = true; paused = false;
  startMusic();
  lastTime = performance.now();
  requestAnimationFrame(frame);
}

function gameOver() {
  playing = false;
  stopMusic(); sfx.crash();
  const s = Math.floor(score);
  const best = Math.max(s, parseInt(localStorage.getItem('subwayRatsHigh') || '0', 10));
  localStorage.setItem('subwayRatsHigh', best);
  document.getElementById('finalScore').textContent = `${s} points · ${cheese} 🧀`;
  document.getElementById('bestScore').textContent = `Best so far: ${best}`;
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('overScreen').classList.remove('hidden');
}

// ---------- audio: everything synthesized with the Web Audio API, no files ----------
let AC = null;
let sfxOn = localStorage.getItem('subwayRatsSfx') !== '0';
let musicOn = localStorage.getItem('subwayRatsMusic') !== '0';
function audio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol, at) {
  const ac = audio(), t = at || ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  jump:   () => sfxOn && tone(300, 680, 0.16, 'square', 0.12),
  duck:   () => sfxOn && tone(420, 160, 0.12, 'square', 0.10),
  lane:   () => sfxOn && tone(240, 320, 0.06, 'triangle', 0.10),
  cheese: () => { if (!sfxOn) return; const t = audio().currentTime; tone(880, 880, 0.07, 'sine', 0.14, t); tone(1318.5, 1318.5, 0.12, 'sine', 0.12, t + 0.07); },
  crash:  () => { if (!sfxOn) return; tone(350, 55, 0.5, 'sawtooth', 0.22); tone(180, 40, 0.5, 'square', 0.16); },
};

// background music: a sneaky 16-step minor loop (bass + sparse lead + hi-hat ticks), scheduled just ahead of the audio clock
const BASS = [110, 0, 110, 0, 130.8, 0, 110, 0, 98, 0, 98, 0, 116.5, 0, 123.5, 0];
const LEAD = [0, 0, 440, 0, 523.3, 0, 440, 0, 0, 392, 0, 466.2, 440, 0, 0, 0];
let musicTimer = null, nextStep = 0, stepIdx = 0;
function pumpMusic() {
  const ac = audio(), stepDur = 60 / 108 / 2;
  if (nextStep < ac.currentTime) nextStep = ac.currentTime + 0.05;
  while (nextStep < ac.currentTime + 0.35) {
    const b = BASS[stepIdx % 16], l = LEAD[stepIdx % 16];
    if (b) tone(b, b, stepDur * 0.9, 'triangle', 0.11, nextStep);
    if (l) tone(l, l, stepDur * 0.7, 'square', 0.035, nextStep);
    if (stepIdx % 4 === 2) tone(6000, 5000, 0.03, 'square', 0.02, nextStep);
    nextStep += stepDur; stepIdx++;
  }
}
function startMusic() { if (!musicOn || musicTimer) return; audio(); nextStep = 0; musicTimer = setInterval(pumpMusic, 120); pumpMusic(); }
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

// ---------- input ----------
function act(dir) {
  if (!playing || paused) return;
  if (dir === 'left' && lane > 0) { lane--; sfx.lane(); }
  if (dir === 'right' && lane < 2) { lane++; sfx.lane(); }
  if (dir === 'up' && jumpT < 0) { jumpT = 0; duckT = -1; sfx.jump(); }
  if (dir === 'down' && duckT < 0) { duckT = 0; jumpT = -1; sfx.duck(); }
}
window.addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { e.preventDefault(); togglePause(); return; }
  const map = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right',
                ArrowUp: 'up', w: 'up', ' ': 'up', ArrowDown: 'down', s: 'down' };
  if (map[e.key] !== undefined) { e.preventDefault(); act(map[e.key]); }
});
let touchX = 0, touchY = 0;
window.addEventListener('touchstart', e => {
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchend', e => {
  if (e.target.closest && e.target.closest('#pauseBtn, #settingsBtn, #settingsPanel, .overlay')) return;
  if (paused) { if (settingsPanel.classList.contains('hidden')) togglePause(); return; }   // tap anywhere resumes (unless settings is open)
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) { act('up'); return; }  // tap = jump
  if (Math.abs(dx) > Math.abs(dy)) act(dx > 0 ? 'right' : 'left');
  else act(dy > 0 ? 'down' : 'up');
}, { passive: true });

// settings panel — opening mid-game pauses; Done resumes if the game was running
const settingsPanel = document.getElementById('settingsPanel');
const speedSlider = document.getElementById('speedSlider');
let resumeAfterSettings = false;
function openSettings() {
  if (playing && !paused) { togglePause(); resumeAfterSettings = true; } else resumeAfterSettings = false;
  speedSlider.value = Math.round(speedMult * 100);
  document.getElementById('speedVal').textContent = speedSlider.value + '%';
  settingsPanel.classList.remove('hidden');
}
function closeSettings() {
  settingsPanel.classList.add('hidden');
  if (resumeAfterSettings && playing && paused) togglePause();
}
speedSlider.addEventListener('input', () => {
  speedMult = speedSlider.value / 100;
  localStorage.setItem('subwayRatsSpeed', speedMult);
  document.getElementById('speedVal').textContent = speedSlider.value + '%';
});
const sfxToggle = document.getElementById('sfxToggle'), musicToggle = document.getElementById('musicToggle');
sfxToggle.checked = sfxOn; musicToggle.checked = musicOn;
sfxToggle.addEventListener('change', () => {
  sfxOn = sfxToggle.checked;
  localStorage.setItem('subwayRatsSfx', sfxOn ? '1' : '0');
});
musicToggle.addEventListener('change', () => {
  musicOn = musicToggle.checked;
  localStorage.setItem('subwayRatsMusic', musicOn ? '1' : '0');
  if (!musicOn) stopMusic(); else if (playing && !paused) startMusic();
});
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsClose').addEventListener('click', closeSettings);

document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('againBtn').addEventListener('click', start);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopMusic();
  else { lastTime = performance.now(); if (playing && !paused) startMusic(); }
});
</script>
</body>
</html>
